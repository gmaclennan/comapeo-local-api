name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Types, lint, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:types
      - run: npm run test:lint
      - run: npm run test:unused
      - run: npm run check:pkg

  # CoMapeo Desktop ships this version and the package must not pull in another
  core-7-5-2:
    name: '@comapeo/core 7.5.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save @comapeo/core@7.5.2
      - run: test "$(node -p "require('./node_modules/@comapeo/core/package.json').version")" = 7.5.2
      - run: npm run test:unit
      - name: Packed package loads with only its dependencies and core 7.5.2
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/comapeo-local-api-*.tgz @comapeo/core@7.5.2
          node --input-type=module -e "const m = await import('@comapeo/local-api'); if (typeof m.createLocalApiServer !== 'function') process.exit(1)"
          test "$(npm ls @comapeo/core --all --parseable | wc -l)" -eq 1

  test:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          # Without disable_search, `files` only adds to the search results, which
          # pick up the raw V8 JSON c8 leaves in coverage/tmp
          files: ./coverage/lcov.info
          disable_search: true
          flags: node-${{ matrix.node }},${{ runner.os }}
